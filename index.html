<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>MINECRAFT LIVE - Countdown</title>
<link rel="icon" type="image/png" href="https://i.imgur.com/Jc53qRn.png">
<link rel="apple-touch-icon" href="https://i.imgur.com/Jc53qRn.png">
<meta name="theme-color" content="#0e2f14">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root{
    --green:#5bd55b;
    --green-dark:#1d5c24;
    --green-deep:#0e2f14;
    --stone:#2b2f33;
    --red:#ff3b3b;
    --font-pixel:'Press Start 2P','Courier New',monospace;
    --font-ui:'Segoe UI',system-ui,-apple-system,Roboto,Arial,sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;overflow:hidden;background:#05070a;color:#fff;font-family:var(--font-ui)}
  body{
    background:
      radial-gradient(1200px 700px at 50% -10%, #17431f 0%, transparent 60%),
      radial-gradient(900px 600px at 50% 120%, #10222f 0%, transparent 60%),
      #05070a;
    transition:background .4s ease;
  }
  body.final{animation:shake .12s infinite}
  @keyframes shake{
    0%,100%{transform:translate(0,0)}
    25%{transform:translate(-3px,2px)}
    50%{transform:translate(3px,-2px)}
    75%{transform:translate(-2px,-3px)}
  }

  /* ---------- Background pixels ---------- */
  #bgBlocks{position:fixed;inset:0;overflow:hidden;z-index:0;opacity:.55;pointer-events:none}
  .bgBlk{position:absolute;background:rgba(91,213,91,.09);border:1px solid rgba(91,213,91,.12);
    animation:float 9s ease-in-out infinite}
  @keyframes float{
    0%{transform:translate(0,0) rotate(0deg)}
    25%{transform:translate(20px,-34px) rotate(7deg)}
    50%{transform:translate(0,-58px) rotate(0deg)}
    75%{transform:translate(-20px,-34px) rotate(-7deg)}
    100%{transform:translate(0,0) rotate(0deg)}
  }

  /* ---------- FX canvas + cursor glow ---------- */
  #fx{position:fixed;inset:0;z-index:60;pointer-events:none}
  #glow{
    position:fixed;left:0;top:0;width:560px;height:560px;margin:-280px 0 0 -280px;
    border-radius:50%;pointer-events:none;z-index:2;opacity:0;transition:opacity .5s ease;
    background:radial-gradient(circle, rgba(91,213,91,.16), rgba(91,213,91,.05) 45%, transparent 68%);
  }
  #glow.on{opacity:1}
  body.final #glow{background:radial-gradient(circle, rgba(255,59,59,.18), rgba(255,59,59,.05) 45%, transparent 68%)}

  /* ---------- Countdown ---------- */
  #countdown{
    position:relative;z-index:5;height:100%;display:flex;flex-direction:column;
    align-items:center;justify-content:center;gap:28px;text-align:center;padding:20px;
    transition:opacity .5s ease, transform .5s ease;
  }
  #countdown.hidden{opacity:0;transform:scale(1.4);pointer-events:none}
  .eyebrow{
    font-family:var(--font-pixel);font-size:clamp(9px,1.3vw,14px);letter-spacing:4px;
    color:var(--green);text-shadow:0 0 18px rgba(91,213,91,.8)
  }
  h1{
    font-family:var(--font-pixel);
    font-size:clamp(18px,4.4vw,52px);
    line-height:1.4;
    color:#fff;
    text-shadow:0 4px 0 var(--green-dark),0 8px 0 #0b2410,0 0 40px rgba(91,213,91,.55);
    letter-spacing:2px;
  }
  h1 .accent{color:var(--green)}

  #timer{display:flex;gap:clamp(8px,1.6vw,22px);flex-wrap:nowrap;
    transition:transform .2s ease;transform-style:preserve-3d;will-change:transform}
  .unit:hover{border-color:rgba(91,213,91,.75);box-shadow:0 0 34px rgba(91,213,91,.35),inset 0 0 30px rgba(91,213,91,.12)}
  .unit{
    transition:border-color .2s ease,box-shadow .2s ease;
    background:linear-gradient(180deg,rgba(20,45,26,.92),rgba(9,22,13,.92));
    border:2px solid rgba(91,213,91,.35);
    border-radius:10px;
    padding:clamp(10px,1.8vw,22px) clamp(12px,2vw,26px);
    min-width:clamp(66px,9vw,140px);
    box-shadow:0 0 24px rgba(91,213,91,.14),inset 0 0 30px rgba(91,213,91,.06);
    position:relative;overflow:hidden;
  }
  .unit::after{
    content:"";position:absolute;inset:0;
    background:linear-gradient(180deg,rgba(255,255,255,.07),transparent 40%);
    pointer-events:none;
  }
  .unit .num{
    display:block;font-family:var(--font-pixel);
    font-size:clamp(20px,4.6vw,56px);
    color:#fff;text-shadow:0 3px 0 var(--green-dark),0 0 24px rgba(91,213,91,.6);
    font-variant-numeric:tabular-nums;
    transition:transform .16s ease,color .16s ease;
  }
  .unit:hover .num{transform:scale(1.09)}
  .unit .lbl{
    display:block;margin-top:10px;font-size:clamp(8px,1vw,12px);
    letter-spacing:2px;text-transform:uppercase;color:#8fd894
  }

  /* Last 5 seconds */
  #secondsUnit{transition:transform .18s ease, box-shadow .18s ease, border-color .18s ease}
  body.final #countdown{background:radial-gradient(circle at 50% 50%,rgba(255,59,59,.14),transparent 65%)}
  body.final #secondsUnit{
    border-color:var(--red);
    box-shadow:0 0 50px rgba(255,59,59,.65),inset 0 0 40px rgba(255,59,59,.25);
    animation:beat .4s ease infinite;
  }
  body.final #secondsUnit .num{color:#fff;text-shadow:0 3px 0 #7a0d0d,0 0 30px rgba(255,59,59,.9)}
  body.final #timer .unit:not(#secondsUnit){filter:saturate(.6) brightness(.8)}
  body.final h1{animation:hue 1s linear infinite}
  @keyframes hue{0%{filter:none}50%{filter:hue-rotate(-25deg) brightness(1.25)}100%{filter:none}}
  @keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}

  #bigNumber{
    position:fixed;inset:0;z-index:40;display:flex;align-items:center;justify-content:center;
    font-family:var(--font-pixel);font-size:clamp(90px,26vw,340px);color:#fff;pointer-events:none;
    text-shadow:0 0 60px rgba(255,59,59,.95),0 0 140px rgba(91,213,91,.7);
    opacity:0;
  }
  #bigNumber.pop{animation:bigPop .95s cubic-bezier(.15,.9,.3,1) forwards}
  @keyframes bigPop{
    0%{opacity:0;transform:scale(.2) rotate(-12deg)}
    22%{opacity:1;transform:scale(1.15) rotate(3deg)}
    60%{opacity:1;transform:scale(1) rotate(0)}
    100%{opacity:0;transform:scale(1.9)}
  }

  /* ---------- Block transition ---------- */
  #blockOverlay{position:fixed;inset:0;z-index:70;pointer-events:none;overflow:hidden}
  .blk{
    position:absolute;transform:scale(0);transition:transform .28s cubic-bezier(.3,1.4,.5,1),opacity .3s ease;
    box-shadow:inset 0 0 0 2px rgba(0,0,0,.35);
  }
  #blockOverlay.show .blk{transform:scale(1)}
  #flash{position:fixed;inset:0;z-index:80;background:#fff;opacity:0;pointer-events:none}
  #flash.on{animation:flashAnim .8s ease forwards}
  @keyframes flashAnim{0%{opacity:0}12%{opacity:.95}100%{opacity:0}}

  /* ---------- Stream ---------- */
  #stream{
    position:fixed;inset:0;z-index:10;display:none;background:#000;
    opacity:0;transform:scale(1.35);transition:opacity .8s ease, transform 1s cubic-bezier(.2,.9,.2,1);
  }
  #stream.ready{opacity:1;transform:scale(1)}
  #stream iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
  #streamInfo{
    position:absolute;top:12px;left:12px;z-index:12;display:flex;align-items:center;gap:10px;
    background:rgba(0,0,0,.6);border:1px solid rgba(91,213,91,.4);border-radius:999px;
    padding:6px 14px;font-family:var(--font-pixel);font-size:10px;color:var(--green);
    backdrop-filter:blur(6px)
  }
  .liveDot{width:9px;height:9px;border-radius:50%;background:var(--red);animation:livePulse 1.1s infinite}
  @keyframes livePulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}

  /* ---------- Test button (arrow only) ---------- */
  #testBtn{
    position:fixed;top:12px;left:12px;z-index:90;
    width:44px;height:44px;padding:0;display:flex;align-items:center;justify-content:center;
    cursor:pointer;background:rgba(15,35,20,.85);border:2px solid rgba(91,213,91,.45);border-radius:10px;
    transition:transform .12s ease, background .2s ease, box-shadow .2s ease;
    backdrop-filter:blur(6px);
  }
  #testBtn .arrow{
    width:0;height:0;border-style:solid;
    border-width:8px 0 8px 14px;
    border-color:transparent transparent transparent #dff7df;
    margin-left:4px;transition:border-left-color .2s ease;
  }
  #testBtn:hover{background:rgba(30,70,38,.95);box-shadow:0 0 18px rgba(91,213,91,.45)}
  #testBtn:active{transform:scale(.94)}
  #testBtn.gone{opacity:0;transform:scale(.7);pointer-events:none;transition:opacity .4s ease,transform .4s ease}
  #testBtn.running{border-color:var(--red);box-shadow:0 0 18px rgba(255,59,59,.5)}
  #testBtn.running .arrow{border-left-color:#ffd9d9;animation:beatSmall .9s ease infinite}
  @keyframes beatSmall{0%,100%{transform:scale(1);opacity:1}50%{transform:scale(.7);opacity:.5}}

  /* ---------- Chat ---------- */
  #chatToggle{
    position:fixed;right:16px;bottom:16px;z-index:95;
    height:34px;min-width:34px;padding:0 9px;border-radius:999px;cursor:pointer;border:2px solid rgba(91,213,91,.5);
    background:linear-gradient(180deg,#1c4a26,#0c2312);color:#dff7df;font-size:7px;letter-spacing:0.5px;
    font-family:var(--font-pixel);
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 6px 24px rgba(0,0,0,.5),0 0 22px rgba(91,213,91,.25);
    transition:transform .15s ease, box-shadow .2s ease;
  }
  #chatToggle:hover{transform:scale(1.08);box-shadow:0 6px 28px rgba(0,0,0,.6),0 0 34px rgba(91,213,91,.5)}
  #chatToggle .badge{
    position:absolute;top:-5px;right:-5px;background:var(--red);color:#fff;font-size:7px;
    min-width:12px;height:12px;border-radius:999px;display:flex;align-items:center;justify-content:center;
    font-weight:700;padding:0 3px
  }
  #chatPanel{
    position:fixed;top:0;right:0;bottom:0;width:min(340px,86vw);z-index:94;
    background:linear-gradient(180deg,rgba(10,20,14,.96),rgba(5,10,7,.97));
    border-left:2px solid rgba(91,213,91,.3);
    display:flex;flex-direction:column;
    transform:translateX(102%);transition:transform .35s cubic-bezier(.3,1,.4,1);
    backdrop-filter:blur(10px);
  }
  #chatPanel.open{transform:translateX(0)}
  .chatHead{
    padding:14px 16px;border-bottom:1px solid rgba(91,213,91,.22);
    display:flex;align-items:center;justify-content:space-between;gap:10px
  }
  .chatHead .t{font-family:var(--font-pixel);font-size:10px;color:var(--green);letter-spacing:1px}
  .chatHead .who{font-size:11px;color:#8fa894;margin-top:4px}
  .chatHead button{
    background:transparent;border:1px solid rgba(91,213,91,.35);color:#cfe9d2;border-radius:6px;
    padding:5px 9px;cursor:pointer;font-size:11px
  }
  .chatHead button:hover{background:rgba(91,213,91,.15)}
  .chatStatus{padding:6px 14px;font-size:11px;color:#8fa894;border-bottom:1px solid rgba(91,213,91,.12)}
  .chatStatus.online{color:var(--green)}
  .chatStatus.offline{color:#ffb4b4}
  #chatMessages{
    flex:1;overflow-y:auto;padding:12px;display:flex;flex-direction:column;gap:8px;
    scrollbar-width:thin;scrollbar-color:#2e6b38 transparent
  }
  #chatMessages::-webkit-scrollbar{width:8px}
  #chatMessages::-webkit-scrollbar-thumb{background:#2e6b38;border-radius:8px}
  .msg{
    background:rgba(255,255,255,.045);border:1px solid rgba(255,255,255,.06);
    border-radius:10px;padding:7px 10px;font-size:13px;line-height:1.45;word-wrap:break-word
  }
  .msg .name{color:var(--green);font-weight:700;font-size:12px;display:block;margin-bottom:2px}
  .msg.mine{background:rgba(91,213,91,.12);border-color:rgba(91,213,91,.3)}
  .msg.system{color:#93a89a;font-style:italic;font-size:12px;text-align:center;background:transparent;border:none}
  #chatFoot{
    padding:10px;border-top:1px solid rgba(91,213,91,.22);display:flex;gap:8px;align-items:center
  }
  #chatName{
    width:86px;flex:none;background:rgba(255,255,255,.06);border:1px solid rgba(91,213,91,.3);
    color:#fff;border-radius:8px;padding:9px 8px;font-size:12px;outline:none;font-family:var(--font-ui)
  }
  #chatInput{
    flex:1;background:rgba(255,255,255,.06);border:1px solid rgba(91,213,91,.3);
    color:#fff;border-radius:8px;padding:9px 11px;font-size:13px;outline:none;font-family:var(--font-ui)
  }
  #chatInput:focus,#chatName:focus{border-color:var(--green);box-shadow:0 0 14px rgba(91,213,91,.3)}
  #chatSend{
    background:linear-gradient(180deg,#2e7d3a,#1a4c22);border:1px solid rgba(91,213,91,.5);
    color:#fff;border-radius:8px;padding:9px 12px;cursor:pointer;font-weight:600;font-size:12px
  }
  #chatSend:hover{background:linear-gradient(180deg,#3a9c48,#205c2a)}
  .shake{animation:shakeInput .4s ease}
  @keyframes shakeInput{
    0%,100%{transform:translateX(0)}
    20%{transform:translateX(-6px)}
    45%{transform:translateX(6px)}
    70%{transform:translateX(-4px)}
  }
  .nameWarn{border-color:#ff3b3b !important;box-shadow:0 0 14px rgba(255,59,59,.55) !important}
  #chatBar{
    position:fixed;right:16px;bottom:16px;z-index:93;transform:translateX(102%);
    transition:transform .35s cubic-bezier(.3,1,.4,1);
    background:rgba(0,0,0,.65);border:1px solid rgba(91,213,91,.35);border-radius:999px;
    padding:8px 14px;font-size:12px;color:#9fe0a6
  }
  @media (max-width:520px){
    #timer{gap:6px}
    .unit{min-width:0;padding:9px 10px;border-radius:8px}
    .unit .lbl{font-size:7px;letter-spacing:1px;margin-top:6px}
  }
</style>
</head>
<body>
<div id="bgBlocks"></div>
<canvas id="fx"></canvas>
<div id="glow"></div>

<div id="countdown">
  <div class="eyebrow">LIVE IN</div>
  <h1>MINECRAFT <span class="accent">LIVE</span></h1>
  <div id="timer">
    <div class="unit" id="dUnit"><span class="num" id="d">00</span><span class="lbl">Days</span></div>
    <div class="unit" id="hUnit"><span class="num" id="h">00</span><span class="lbl">Hours</span></div>
    <div class="unit" id="mUnit"><span class="num" id="m">00</span><span class="lbl">Minutes</span></div>
    <div class="unit" id="secondsUnit"><span class="num" id="s">00</span><span class="lbl">Seconds</span></div>
  </div>
</div>

<div id="bigNumber"></div>

<div id="stream">
  <div id="streamInfo"><span class="liveDot"></span> MINECRAFT LIVE</div>
  <iframe id="ytFrame" title="YouTube video player"
          allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share"
          referrerpolicy="strict-origin-when-cross-origin" allowfullscreen></iframe>
</div>

<div id="blockOverlay"></div>
<div id="flash"></div>

<button id="testBtn" title="Test the transition with a 10 second countdown (or press T)" aria-label="Start 10 second test">
  <span class="arrow"></span>
</button>

<button id="chatToggle" title="Show or hide the chat">CHAT<span class="badge" id="chatBadge" style="display:none">0</span></button>
<aside id="chatPanel">
  <div class="chatHead">
    <div>
      <div class="t">CUSTOM CHAT</div>
      <div class="who" id="chatWho">Choose your name</div>
    </div>
    <button id="closeChat">X</button>
  </div>
  <div class="chatStatus" id="chatStatus">Connecting to the chat...</div>
  <div id="chatMessages"></div>
  <div id="chatFoot">
    <input id="chatName" maxlength="12" placeholder="Your name" autocomplete="off" />
    <input id="chatInput" maxlength="300" placeholder="Type a message..." autocomplete="off" />
    <button id="chatSend">SEND</button>
  </div>
</aside>
<div id="chatBar">Chat is hidden - click CHAT at the bottom right</div>

<script>
(function () {
  "use strict";

  /* ============ CONFIG ============ */
  var VIDEO_ID = "9njefMDxzqw";
  // 26.09.2026, 19:00 German time (CEST = UTC+2)
  var TARGET = new Date("2026-09-26T19:00:00+02:00").getTime();
  var TEST_MS = 10 * 1000;
  /* ================================= */

  var $ = function (id) { return document.getElementById(id); };

  var elCountdown = $("countdown");
  var elStream = $("stream");
  var elFrame = $("ytFrame");
  var elBig = $("bigNumber");
  var elOverlay = $("blockOverlay");
  var elFlash = $("flash");
  var elTest = $("testBtn");
  var elD = $("d"), elH = $("h"), elM = $("m"), elS = $("s");

  var target = TARGET;
  var started = false;
  var lastSecondShown = null;

  function pad(n) { return (n < 10 ? "0" : "") + n; }

  /* ---------- Background pixels ---------- */
  (function buildBg() {
    var wrap = $("bgBlocks");
    for (var i = 0; i < 26; i++) {
      var b = document.createElement("div");
      b.className = "bgBlk";
      var size = 18 + Math.random() * 70;
      b.style.width = size + "px";
      b.style.height = size + "px";
      b.style.left = Math.random() * 100 + "%";
      b.style.top = Math.random() * 100 + "%";
      b.style.animationDelay = (Math.random() * 2) + "s";
      b.style.animationDuration = (2.5 + Math.random() * 2.5) + "s";
      wrap.appendChild(b);
    }
  })();

  /* ---------- FX canvas ---------- */
  var canvas = $("fx"), ctx = canvas.getContext("2d");
  var parts = [];
  var dpr = Math.min(window.devicePixelRatio || 1, 2);
  function resizeCanvas() {
    canvas.width = Math.floor(innerWidth * dpr);
    canvas.height = Math.floor(innerHeight * dpr);
    canvas.style.width = innerWidth + "px";
    canvas.style.height = innerHeight + "px";
  }
  resizeCanvas();
  addEventListener("resize", resizeCanvas);

  var COLORS = ["#5bd55b", "#3fa64b", "#8bd450", "#4ade4a", "#7ee87e", "#2e7d32"];
  function burst(x, y, amount, power) {
    for (var i = 0; i < amount; i++) {
      var a = Math.random() * Math.PI * 2;
      var sp = (1.1 + Math.random() * 0.9) * power;
      parts.push({
        x: x, y: y,
        vx: Math.cos(a) * sp,
        vy: Math.sin(a) * sp - power * 0.5,
        s: 2 + Math.random() * 5,
        rot: Math.random() * Math.PI,
        vr: (Math.random() - 0.5) * 0.3,
        life: 1,
        col: COLORS[(Math.random() * COLORS.length) | 0]
      });
    }
  }
  function tickFx() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for (var i = parts.length - 1; i >= 0; i--) {
      var p = parts[i];
      p.x += p.vx * dpr; p.y += p.vy * dpr;
      p.vy += 0.12 * dpr;
      p.vx *= 0.99;
      p.rot += p.vr;
      p.life -= 0.014;
      if (p.life <= 0 || p.y > canvas.height + 60) { parts.splice(i, 1); continue; }
      ctx.save();
      ctx.globalAlpha = Math.max(0, Math.min(1, p.life));
      ctx.translate(p.x, p.y);
      ctx.rotate(p.rot);
      ctx.fillStyle = p.col;
      ctx.fillRect(-p.s / 2, -p.s / 2, p.s, p.s);
      ctx.restore();
    }
    requestAnimationFrame(tickFx);
  }
  tickFx();

  /* ---------- Interactivity: glow, parallax, click bursts, 3D tilt ---------- */
  var glow = $("glow");
  var timerEl = $("timer");
  var hasPointer = window.matchMedia && window.matchMedia("(pointer: fine)").matches;

  var mx = 0, my = 0, gx = 0, gy = 0, rafPending = false;

  function animateGlow() {
    rafPending = false;
    gx += (mx - gx) * 0.35;
    gy += (my - gy) * 0.35;
    glow.style.transform = "translate(" + gx + "px," + gy + "px)";
    if (Math.abs(mx - gx) > 0.4 || Math.abs(my - gy) > 0.4) {
      rafPending = true;
      requestAnimationFrame(animateGlow);
    }
  }

  addEventListener("mousemove", function (e) {
    mx = e.clientX; my = e.clientY;
    glow.classList.add("on");

    if (!rafPending) { rafPending = true; requestAnimationFrame(animateGlow); }
  });

  addEventListener("mouseout", function (e) {
    if (!e.relatedTarget) glow.classList.remove("on");
  });

  // Cursor follows mouse; clicking anywhere throws blocks
  addEventListener("pointerdown", function (e) {
    enableAudio();
    burst(e.clientX * dpr, e.clientY * dpr, e.pointerType === "touch" ? 34 : 22, 16);
  });

  // 3D tilt on the countdown boxes
  if (hasPointer) {
    timerEl.addEventListener("mousemove", function (e) {
      var r = timerEl.getBoundingClientRect();
      var px = (e.clientX - r.left) / r.width - 0.5;
      var py = (e.clientY - r.top) / r.height - 0.5;
      timerEl.style.transform = "perspective(900px) rotateY(" + (px * 14).toFixed(2) +
        "deg) rotateX(" + (-py * 14).toFixed(2) + "deg) scale(1.04)";
    });
    timerEl.addEventListener("mouseleave", function () { timerEl.style.transform = ""; });
  }

  // Press T to run the 10 second test
  addEventListener("keydown", function (e) {
    if (started) return;
    var a = document.activeElement;
    if (a && (a.tagName === "INPUT" || a.tagName === "TEXTAREA")) return;
    if (e.key === "t" || e.key === "T") startTest();
  });

  /* ---------- Sound ---------- */
  var audioCtx = null;
  function enableAudio() {
    if (audioCtx) return;
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (AC) audioCtx = new AC();
    } catch (e) { audioCtx = null; }
  }
  function beep(freq, dur, gain) {
    if (!audioCtx) return;
    try {
      if (audioCtx.state === "suspended") audioCtx.resume();
      var o = audioCtx.createOscillator();
      var g = audioCtx.createGain();
      o.type = "square";
      o.frequency.value = freq;
      g.gain.setValueAtTime(gain, audioCtx.currentTime);
      g.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + dur);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(); o.stop(audioCtx.currentTime + dur);
    } catch (e) {}
  }

  /* ---------- Countdown ---------- */
  function showBig(n) {
    elBig.textContent = n;
    elBig.classList.remove("pop");
    void elBig.offsetWidth; // reflow so the animation restarts
    elBig.classList.add("pop");
    var cx = innerWidth / 2 * dpr, cy = innerHeight / 2 * dpr;
    burst(cx, cy, 46, 5);
    beep(660 + (5 - n) * 110, 0.16, 0.07);
  }

  function render(msLeft) {
    if (msLeft < 0) msLeft = 0;
    var total = Math.floor(msLeft / 1000);
    var days = Math.floor(total / 86400);
    var hours = Math.floor((total % 86400) / 3600);
    var mins = Math.floor((total % 3600) / 60);
    var secs = total % 60;

    elD.textContent = pad(days);
    elH.textContent = pad(hours);
    elM.textContent = pad(mins);
    elS.textContent = pad(secs);

    return total;
  }

  function startTest() {
    enableAudio();
    if (started) return;
    target = Date.now() + TEST_MS;
    elTest.classList.add("running");
    beep(880, 0.08, 0.05);
  }

  elTest.addEventListener("click", function (e) {
    e.stopPropagation();
    startTest();
  });

  function loop() {
    var msLeft = target - Date.now();

    if (!started) {
      var total = render(msLeft);
      var inFinal = total > 0 && total <= 5;

      if (inFinal) {
        document.body.classList.add("final");
        if (total !== lastSecondShown) {
          lastSecondShown = total;
          showBig(total);
        }
      } else {
        document.body.classList.remove("final");
        lastSecondShown = null;
      }

      if (msLeft <= 0) {
        render(0);
        startTransition();
        return;
      }
    }
    requestAnimationFrame(loop);
  }

  /* ---------- The block transition ---------- */
  var COLORS_BLOCK = ["#3fa64b", "#2e7d32", "#5bbf5b", "#1f5c24", "#8bd450", "#276b2b", "#143d1a", "#4aa855"];

  function buildBlocks() {
    elOverlay.innerHTML = "";
    var cols = 14, rows = 9;
    for (var r = 0; r < rows; r++) {
      for (var c = 0; c < cols; c++) {
        var b = document.createElement("div");
        b.className = "blk";
        b.style.background = COLORS_BLOCK[(Math.random() * COLORS_BLOCK.length) | 0];
        b.style.left = (c / cols * 100) + "%";
        b.style.top = (r / rows * 100) + "%";
        b.style.width = (100 / cols + 0.6) + "%";
        b.style.height = (100 / rows + 0.6) + "%";
        b.style.transitionDelay = (Math.random() * 340) + "ms";
        elOverlay.appendChild(b);
      }
    }
  }

  function startTransition() {
    if (started) return;
    started = true;
    document.body.classList.remove("final");

    var cx = innerWidth / 2 * dpr, cy = innerHeight / 2 * dpr;
    burst(cx, cy, 220, 11);
    beep(300, 0.5, 0.09);

    elFlash.classList.add("on");
    buildBlocks();
    elOverlay.classList.add("show");
    elCountdown.classList.add("hidden");

    elFrame.src = "https://www.youtube.com/embed/" + VIDEO_ID +
      "?si=-6Nggp7TSDTcIpeH&controls=0&autoplay=1&playsinline=1";

    // the test button is no longer needed once the countdown is over
    elTest.classList.add("gone");

    setTimeout(function () {
      elCountdown.style.display = "none";
      elStream.style.display = "block";
      void elStream.offsetWidth;
      elStream.classList.add("ready");
      var cx2 = innerWidth / 2 * dpr, cy2 = innerHeight / 2 * dpr;
      burst(cx2, cy2, 140, 9);
    }, 700);

    setTimeout(function () {
      elOverlay.classList.remove("show");
    }, 1150);

    setTimeout(function () {
      elOverlay.innerHTML = "";
      elOverlay.style.display = "none";
    }, 1900);
  }

  /* ================================================================
     CHAT - real, shared between everyone on the site.
     Uses free public MQTT brokers over WebSocket: no account, no key,
     works on GitHub Pages (wss) and for every visitor automatically.
     Everyone who opens this page joins the same room (= TOPIC).
     ================================================================ */
  var MQTT_BROKERS = [
    "wss://broker.emqx.io:8084/mqtt",
    "wss://broker.hivemq.com:8884/mqtt"
  ];
  var MQTT_TOPIC = "codebuff-public/minecraft-live-2026/9njefMDxzqw/room1";
  var MQTT_CDN = "https://cdn.jsdelivr.net/npm/mqtt@5/dist/mqtt.min.js";

  var panel = $("chatPanel");
  var toggle = $("chatToggle");
  var badge = $("chatBadge");
  var bar = $("chatBar");
  var messages = $("chatMessages");
  var input = $("chatInput");
  var nameInput = $("chatName");
  var sendBtn = $("chatSend");
  var who = $("chatWho");
  var statusEl = $("chatStatus");

  var unread = 0;
  var myId = Math.random().toString(36).slice(2) + Date.now().toString(36);
  var channel = null;
  var store = {
    get: function (k, d) { try { return localStorage.getItem(k) || d; } catch (e) { return d; } },
    set: function (k, v) { try { localStorage.setItem(k, v); } catch (e) {} }
  };

  function getName() { return nameInput.value.trim(); }
  function hasName() { return getName().length >= 2; }

  function refreshGate() {
    var ok = hasName();
    who.textContent = ok ? ("You are: " + getName()) : "Choose your name";
    if (ok) nameInput.classList.remove("nameWarn");
  }

  function warnName() {
    addMsg(null, "Choose your name", false, true);
    nameInput.classList.add("nameWarn");
    nameInput.classList.remove("shake");
    void nameInput.offsetWidth;
    nameInput.classList.add("shake");
    nameInput.focus();
  }

  function setStatus(text, cls) {
    statusEl.textContent = text;
    statusEl.className = "chatStatus" + (cls ? " " + cls : "");
  }

  nameInput.value = store.get("mc_name", "");
  refreshGate();

  nameInput.addEventListener("input", function () {
    store.set("mc_name", getName());
    refreshGate();
  });

  function addMsg(name, text, mine, system) {
    var div = document.createElement("div");
    div.className = "msg" + (mine ? " mine" : "") + (system ? " system" : "");
    if (!system) {
      var n = document.createElement("span");
      n.className = "name";
      n.textContent = name;
      div.appendChild(n);
    }
    var t = document.createElement("span");
    t.textContent = text;
    div.appendChild(t);
    messages.appendChild(div);
    messages.scrollTop = messages.scrollHeight;

    if (!panel.classList.contains("open") && !system) {
      unread++;
      badge.style.display = "flex";
      badge.textContent = unread > 99 ? "99+" : String(unread);
    }
  }

  /* ---------- Realtime connection (public MQTT brokers) ---------- */
  function loadScript(src, ok, fail) {
    var s = document.createElement("script");
    s.src = src;
    s.onload = ok;
    s.onerror = fail;
    document.head.appendChild(s);
  }

  function initRealtime() {
    setStatus("Connecting to the chat...");
    loadScript(MQTT_CDN, function () { connectBroker(0); }, function () {
      setStatus("Could not load the chat script", "offline");
    });
  }

  function connectBroker(index) {
    if (index >= MQTT_BROKERS.length) {
      setStatus("Chat offline - reload the page to retry", "offline");
      return;
    }
    var client;
    try {
      client = window.mqtt.connect(MQTT_BROKERS[index], {
        clientId: "mclive_" + Math.random().toString(16).slice(2, 12),
        clean: true,
        keepalive: 30,
        connectTimeout: 8000,
        reconnectPeriod: 0
      });
    } catch (e) {
      connectBroker(index + 1);
      return;
    }

    var settled = false;
    var giveUp = setTimeout(function () {
      if (settled) return;
      settled = true;
      try { client.end(true); } catch (e) {}
      connectBroker(index + 1);
    }, 9000);

    client.on("connect", function () {
      if (settled) return;
      settled = true;
      clearTimeout(giveUp);
      channel = client;
      client.subscribe(MQTT_TOPIC, { qos: 0 });
      setStatus("Connected - everyone here sees your messages", "online");
    });

    client.on("message", function (topic, payload) {
      try {
        var d = JSON.parse(payload.toString());
        if (!d || d.id === myId || !d.name || !d.text) return;
        addMsg(String(d.name).slice(0, 12), String(d.text).slice(0, 300), false, false);
      } catch (e) {}
    });

    client.on("error", function () {
      if (settled) return;
      settled = true;
      clearTimeout(giveUp);
      try { client.end(true); } catch (e) {}
      connectBroker(index + 1);
    });

    client.on("close", function () {
      if (settled) return;
      settled = true;
      clearTimeout(giveUp);
      connectBroker(index + 1);
    });
  }

  function send() {
    var text = input.value.trim();
    if (!text) return;
    if (!hasName()) { warnName(); return; }
    var name = getName();
    if (channel) {
      try {
        channel.publish(MQTT_TOPIC, JSON.stringify({ id: myId, name: name, text: text }), { qos: 0 });
      } catch (e) {}
    }
    addMsg(name, text, true, false);
    input.value = "";
  }

  sendBtn.addEventListener("click", send);
  input.addEventListener("keydown", function (e) { if (e.key === "Enter") send(); });
  nameInput.addEventListener("keydown", function (e) {
    if (e.key === "Enter" && hasName()) { input.focus(); e.preventDefault(); }
  });

  function setChat(open) {
    panel.classList.toggle("open", open);
    bar.style.transform = open ? "translateX(0)" : "translateX(102%)";
    if (open) {
      unread = 0;
      badge.style.display = "none";
      (hasName() ? input : nameInput).focus();
    }
  }

  toggle.addEventListener("click", function () {
    enableAudio();
    setChat(!panel.classList.contains("open"));
  });
  $("closeChat").addEventListener("click", function () { setChat(false); });

  addEventListener("keydown", function (e) {
    if (e.key === "Escape" && panel.classList.contains("open")) setChat(false);
  });

  initRealtime();

  /* ---------- Start ---------- */
  loop();
})();
</script>
</body>
</html>
